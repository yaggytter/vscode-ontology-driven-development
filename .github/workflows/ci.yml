name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run verify
      - name: Build core and the oont CLI
        run: npm run build
      - name: Smoke-test the built oont CLI
        run: |
          node packages/cli/bin/oont.js --version
          node packages/cli/bin/oont.js validate --strict packages/vscode/samples examples packages/core/fixtures
      - run: npm run package
      - name: Upload VSIX for review
        uses: actions/upload-artifact@v4
        with:
          name: ontology-driven-development-vsix
          path: packages/vscode/*.vsix
          if-no-files-found: error
          retention-days: 14

  integration:
    name: VS Code integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:integration

  examples:
    name: Claude Code examples (${{ matrix.example }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [object-ontology-mcp, semantic-web-sparql]
    defaults:
      run:
        working-directory: examples/claude-code/${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: examples/claude-code/${{ matrix.example }}/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run typecheck
      - run: npm test
